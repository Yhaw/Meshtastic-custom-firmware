; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = tbeam

extra_configs =
	variants/*/*.ini
	variants/*/*/platformio.ini
	variants/*/diy/*/platformio.ini
	src/graphics/niche/InkHUD/PlatformioConfig.ini

description = Meshtastic

[env]
test_build_src = true
extra_scripts =
	pre:bin/platformio-pre.py
	bin/platformio-custom.py
; note: we add src to our include search path so that lmic_project_config can override
; note: TINYGPS_OPTION_NO_CUSTOM_FIELDS is VERY important.  We don't use custom fields and somewhere in that pile
; of code is a heap corruption bug!
; FIXME: fix lib/BluetoothOTA dependency back on src/ so we can remove -Isrc
; The Radiolib stuff will speed up building considerably. Exclud all the stuff we dont need.
build_flags = -Wno-missing-field-initializers
	-faligned-new
	-Wno-format
	-Isrc -Isrc/mesh -Isrc/mesh/generated -Isrc/gps -Isrc/buzz -Wl,-Map,"${platformio.build_dir}"/output.map
	-include "${PROJECT_DIR}/src/optimization_flags.h"
	-DCROWD_SENSE_TERRA
	-DENABLE_BME280
	-DENABLE_BME680
	-DENABLE_DS18B20
	-DENABLE_INA219
	-DENABLE_VEML7700
	-DENABLE_LTR390
	-DENABLE_SOIL_MOISTURE_CAPACITIVE
	-DENABLE_SOIL_NPK

monitor_speed = 115200
monitor_filters = direct
lib_deps =
	# renovate: datasource=git-refs depName=meshtastic-esp8266-oled-ssd1306 packageName=https://github.com/meshtastic/esp8266-oled-ssd1306 gitBranch=master
	https://github.com/meshtastic/esp8266-oled-ssd1306/archive/2887bf4a19f64d92c984dcc8fd5ca7429e425e4a.zip
	# renovate: datasource=git-refs depName=meshtastic-OneButton packageName=https://github.com/meshtastic/OneButton gitBranch=master
	https://github.com/meshtastic/OneButton/archive/fa352d668c53f290cfa480a5f79ad422cd828c70.zip
	# renovate: datasource=git-refs depName=meshtastic-arduino-fsm packageName=https://github.com/meshtastic/arduino-fsm gitBranch=master
	https://github.com/meshtastic/arduino-fsm/archive/7db3702bf0cfe97b783d6c72595e3f38e0b19159.zip
	# renovate: datasource=git-refs depName=meshtastic-TinyGPSPlus packageName=https://github.com/meshtastic/TinyGPSPlus gitBranch=master
	https://github.com/meshtastic/TinyGPSPlus/archive/71a82db35f3b973440044c476d4bcdc673b104f4.zip
	# renovate: datasource=git-refs depName=meshtastic-ArduinoThread packageName=https://github.com/meshtastic/ArduinoThread gitBranch=master
	https://github.com/meshtastic/ArduinoThread/archive/b841b0415721f1341ea41cccfb4adccfaf951567.zip
	# renovate: datasource=custom.pio depName=Nanopb packageName=nanopb/library/Nanopb
	nanopb/Nanopb@0.4.91
	# renovate: datasource=custom.pio depName=ErriezCRC32 packageName=erriez/library/ErriezCRC32
	erriez/ErriezCRC32@1.0.1
	# OneWire and DallasTemperature for DS18B20 temperature sensor
	# renovate: datasource=custom.pio depName=OneWire packageName=paulstoffregen/library/OneWire
	paulstoffregen/OneWire@^2.3.8
	# renovate: datasource=custom.pio depName=DallasTemperature packageName=milesburton/library/DallasTemperature
	milesburton/DallasTemperature@^3.11.0
	# LiquidCrystal_I2C for 20x4 LCD fallback
	# renovate: datasource=git-refs depName=LiquidCrystal_I2C packageName=https://github.com/johnrickman/LiquidCrystal_I2C gitBranch=master
	https://github.com/johnrickman/LiquidCrystal_I2C/archive/refs/tags/1.1.2.zip

; Used for the code analysis in PIO Home / Inspect
check_tool = cppcheck
check_skip_packages = yes
check_flags =
	-DAPP_VERSION=1.0.0
	--suppressions-list=suppressions.txt
	--inline-suppr

; Common settings for conventional (non Portduino) Arduino targets
[arduino_base]
framework = arduino
lib_deps =
	${env.lib_deps}
	# renovate: datasource=custom.pio depName=NonBlockingRTTTL packageName=end2endzone/library/NonBlockingRTTTL
	end2endzone/NonBlockingRTTTL@1.4.0
build_flags = ${env.build_flags} -Os
build_src_filter = ${env.build_src_filter} -<platform/portduino/> -<graphics/niche/>

; Common libs for communicating over TCP/IP networks such as MQTT
[networking_base]
lib_deps =
	# renovate: datasource=custom.pio depName=TBPubSubClient packageName=thingsboard/library/TBPubSubClient
	thingsboard/TBPubSubClient@2.12.1
	# renovate: datasource=custom.pio depName=NTPClient packageName=arduino-libraries/library/NTPClient
	arduino-libraries/NTPClient@3.2.1

; Extra TCP/IP networking libs for supported devices
[networking_extra]
lib_deps =
	# renovate: datasource=custom.pio depName=Syslog packageName=arcao/library/Syslog
	arcao/Syslog@2.0.0

[radiolib_base]
lib_deps =
	# renovate: datasource=custom.pio depName=RadioLib packageName=jgromes/library/RadioLib
	# jgromes/RadioLib@7.4.0
	https://github.com/jgromes/RadioLib/archive/536c7267362e2c1345be7054ba45e503252975ff.zip

