; Meshtastic DIY v1 by Nano VHF Schematic based on ESP32-WROOM-32 (38 pins) devkit & EBYTE E22 SX1262/SX1268 module
[env:meshtastic-diy-v1]
extends = esp32_base
board = esp32doit-devkit-v1
board_check = true
build_flags =
  ${esp32_base.build_flags}
  -D DIY_V1
  -D EBYTE_E22
  -D ENABLE_BME680
  -I variants/esp32/diy/v1

lib_deps =
  ${arduino_base.lib_deps}
  ${networking_base.lib_deps}
  ${networking_extra.lib_deps}
  ; ${environmental_base.lib_deps} ; REMOVED: Contains unauthorized sensors
  ; ${environmental_extra.lib_deps} ; REMOVED: Contains unauthorized sensors
  ${radiolib_base.lib_deps}
  
  ; CORE DEPENDENCIES (BusIO & Unified Sensor required for Adafruit libs)
  adafruit/Adafruit BusIO@1.17.4
  adafruit/Adafruit Unified Sensor@1.1.15

  ; CROWDSENSE TERRA AUTHORIZED SENSORS
  adafruit/Adafruit BME280 Library@2.3.0
  boschsensortec/bsec2@1.10.2610
  boschsensortec/BME68x Sensor Library@1.3.40408
  adafruit/Adafruit INA219@1.2.3
  adafruit/Adafruit VEML7700 Library@2.1.6
  adafruit/Adafruit LTR390 Library@1.1.2
  adafruit/Adafruit MPU6050 @ 2.2.4
  adafruit/Adafruit LIS3DH@1.2.6

  ; PLATFORM DEPENDENCIES
  https://github.com/meshtastic/esp32_https_server/archive/3223704846752e6d545139204837bdb2a55459ca.zip
  h2zero/NimBLE-Arduino@1.4.3
  https://github.com/dbinfrago/libpax/archive/3cdc0371c375676a97967547f4065607d4c53fd1.zip
  lewisxhe/XPowersLib@0.3.2
  https://github.com/meshtastic/ESP32_Codec2/archive/633326c78ac251c059ab3a8c430fcdf25b41672f.zip
  rweather/Crypto@0.4.0

build_src_filter = ${esp32_base.build_src_filter} 
  -<modules/Telemetry/Sensor/*>
  +<modules/Telemetry/Sensor/TelemetrySensor.*>
  +<modules/Telemetry/Sensor/BME280Sensor.*>
  +<modules/Telemetry/Sensor/BME680Sensor.*>
  +<modules/Telemetry/Sensor/DS18B20Sensor.*>
  +<modules/Telemetry/Sensor/INA219Sensor.*>
  +<modules/Telemetry/Sensor/VEML7700Sensor.*>
  +<modules/Telemetry/Sensor/LTR390UVSensor.*>
  +<modules/Telemetry/Sensor/CapacitiveSoilSensor.*>
  +<modules/Telemetry/Sensor/RCWL9620Sensor.*>
  +<modules/Telemetry/Sensor/CGRadSensSensor.*>
  +<modules/Telemetry/Sensor/nullSensor.*>
  -<motion/*>
  +<motion/MotionSensor.*>
  +<motion/MPU6050Sensor.*>
  +<motion/LIS3DHSensor.*>
  -<mesh/eth/*>
  -<mesh/api/ethServerAPI.*>
